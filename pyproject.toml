[project]
name = "hermes-observer"
version = "0.1.0"
description = "Web UI for observing hermes-agent: mem0 event logs and prompt timing"
# 3.11 for tomllib: the tab configuration is TOML (ADR 5) and reading it
# should not need a dependency.
requires-python = ">=3.11"
dependencies = ["flask>=3.0"]

[dependency-groups]
dev = ["pytest>=8"]

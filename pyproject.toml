[project]
name = "hobserver"
version = "0.3.0"
description = "Web UI for observing Hermes Agent activity in live and recent sessions (e.g. assistant conversations)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Justin Clark-Casey" }]
# 3.11 for tomllib: the tab configuration is TOML (ADR 5) and reading it
# should not need a dependency.
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    # The full-value page renders a prompt or an answer as the markdown it is
    # (ADR 12). Pure Python, no dependencies of its own, and used with raw
    # HTML disabled — see plugins/turns/fulltext.py, which also degrades to
    # plain text if it is not importable. The bar for a third dependency is
    # this one: something this tree should not hand-roll, behind a
    # degradation path.
    "markdown-it-py>=3",
    # The WSGI server (ADR 14). This app binds 0.0.0.0, which wants a server
    # written to face a network; waitress is pure Python and dependency-free,
    # so it costs nothing at install time and runs wherever this app does.
    "waitress>=3.0",
]

[project.urls]
Homepage = "https://github.com/justincc/hobserver"
Repository = "https://github.com/justincc/hobserver"
Issues = "https://github.com/justincc/hobserver/issues"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
# Tests live with what they test: the shell's under tests/, a plugin's under
# plugins/<name>/tests/. Both roots are named so `uv run pytest` from the
# repo root collects everything, and so adding a plugin adds its tests with
# no further wiring.
testpaths = ["tests", "plugins"]
# The repo root on sys.path, so a test anywhere can `import app`, `import
# tabs`, or `from conftest import make_app`. Declared rather than inherited
# from the working directory, which is what made the old layout's imports
# work by accident.
pythonpath = ["."]

# A starting point. hobserver runs without any config file — the Turns tab on
# loopback — so copy this to `hobserver.toml` (untracked) only when you want to
# change something: the bind address, a source path, another tab, your own tabs.
#
#     cp hobserver.example.toml hobserver.toml
#
# ---------------------------------------------------------------------------
# How hobserver is configured: the tabs it serves, and where it binds.
#
# The `[[plugins]]` entries below are served in order, and the first serves /.
# Each `plugin` is an importable module path: `plugins.turns` from this tree
# and `hobserver_zep` from site-packages load the same way, so a tab written
# elsewhere needs no fork. See docs/extending/writing-a-plugin.md for the contract.
#
# `enabled = false` turns a tab off without removing its settings.
# `settings` is passed to the plugin untouched; ~ and $VARS are expanded.

# Bind address
# host = "127.0.0.1"

[[plugins]]
plugin = "plugins.turns"
# settings = { atof_log = "$HERMES_HOME/nemo-relay/atof/hermes-atof.jsonl" }
#
# `index_db` moves this tab's index of that log, which defaults to a file in
# your cache dir. It is a cache and not a source — delete it whenever you like
# and the next request rebuilds it. See docs/design/adr/0011.
# settings = { index_db = "/var/tmp/hermes-atof-index.sqlite3" }
#
# `scope_specs` names modules declaring how your own hermes tools should show
# on a turn page — one entry per scope, no fork of this tree. A name already
# in this app's table is overridden, and the banner says so at startup. See
# docs/extending/writing-a-scope-spec.md, and span-rendering.md for the
# vocabulary itself.
# settings = { scope_specs = ["hobserver_acme.specs"] }
#
# `provider_specs` names modules declaring how your own router reports token
# counts — one entry per provider payload shape, no fork of this tree. Yours
# are tried before the built-in ones, and the banner names them at startup.
# You need this only when a router names its counts something the built-in
# OpenAI-compatible reading does not recognise. See
# docs/extending/writing-a-provider-spec.md.
# settings = { provider_specs = ["hobserver_acme.providers"] }

# The Mem0 tab is opt-in: it reads a mem0 event log most installs do not
# produce, so it is not served by default. The log comes from the jmem0-logged
# hermes plugin (https://github.com/justincc/jmem0-logged); uncomment this to
# add the tab once you have it.
# [[plugins]]
# plugin = "plugins.memory.mem0"
# settings = { db = "$HERMES_HOME/jmem0_logged.db" }

{# Follow-mode toggle. State lives in localStorage, wired up in base.html —
   which re-resolves this element and its checked state after every live-poll
   swap, so it works either inside the live region (turn page, in the nav row)
   or outside it (index). Never hold a reference to it across a swap. #}
<label class="follow-toggle"
       title="Automatically open a turn's waterfall when a new turn starts (never while already watching one in flight)">
  <input type="checkbox" data-follow-toggle> follow new turns
</label>

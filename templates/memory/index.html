{% extends "base.html" %}
{% block content %}
<table>
  <thead>
    <tr>
      <th>id</th><th>time (UTC)</th><th>type</th><th>session</th><th>platform</th>
      <th>query</th><th>memories</th><th>ms</th>
    </tr>
  </thead>
  <tbody id="events">
    {% include "memory/_event_rows.html" %}
  </tbody>
</table>
<p id="no-events" {% if events %}hidden{% endif %}>No events logged yet.</p>

<script>
  let lastId = {{ events[0]['id'] if events else 0 }};
  const fragmentUrl = "{{ url_for('memory.event_rows_fragment') }}";

  async function pollNewEvents() {
    try {
      const resp = await fetch(`${fragmentUrl}?since=${lastId}`);
      if (!resp.ok) return;
      const html = (await resp.text()).trim();
      if (!html) return;
      const tbody = document.getElementById("events");
      tbody.insertAdjacentHTML("afterbegin", html);
      const rows = tbody.querySelectorAll("tr[data-event-id]");
      lastId = Math.max(...[...rows].map(r => Number(r.dataset.eventId)));
      document.getElementById("no-events").hidden = true;
    } catch (e) {
      // server briefly unreachable — retry on the next tick
    }
  }

  setInterval(pollNewEvents, 3000);
</script>
{% endblock %}

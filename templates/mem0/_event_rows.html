{% for e in events %}
<tr data-event-id="{{ e['id'] }}">
  <td><a href="{{ url_for('mem0.event', event_id=e['id']) }}">{{ e['id'] }}</a></td>
  <td>{{ e['ts_utc'] }}</td>
  <td>{{ e['event_type'] }}</td>
  <td>{{ e['session_id'] }}</td>
  <td>{{ e['platform'] }}</td>
  <td><a href="{{ url_for('mem0.event', event_id=e['id']) }}">{{ (e['query'] or '') | truncate(90) }}</a></td>
  <td class="num">{{ e['memory_count'] }}</td>
  <td class="num">{{ '%.0f' | format(e['elapsed_ms']) if e['elapsed_ms'] is not none }}</td>
</tr>
{% endfor %}

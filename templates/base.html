<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}hermes observer{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1.5rem 1cm; color: #1a1a2e; }
    a { color: #2456c4; text-decoration: none; }
    a:hover { text-decoration: underline; }
    h1 { font-size: 1.4rem; }
    h1 a { color: inherit; }
    h2 { font-size: 1.1rem; margin-top: 2rem; }
    nav.tabs { display: flex; gap: 1.5rem; border-bottom: 1px solid #ddd; margin-bottom: 1.5rem; }
    nav.tabs a { padding: 0.4rem 0.2rem; color: #555; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    nav.tabs a:hover { text-decoration: none; border-bottom-color: #99b3e8; }
    nav.tabs a.active { color: #1a1a2e; font-weight: 600; border-bottom-color: #2456c4; }
    /* pushed to the far right of the tab row: a diagnostic, not a view, so
       it never takes the active underline the tabs use */
    nav.tabs a.status-link { margin-left: auto; color: #777; font-size: 0.85rem; }
    nav.tabs a.status-link:hover { border-bottom-color: transparent; text-decoration: underline; }
    table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
    th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #ddd; vertical-align: top; }
    th { border-bottom: 2px solid #999; }
    td.num { text-align: right; white-space: nowrap; }
    dl.metadata { display: grid; grid-template-columns: max-content 1fr; gap: 0.25rem 1rem; font-size: 0.9rem; background: #f4f5f8; padding: 1rem; border-radius: 6px; }
    dl.metadata dt { font-weight: 600; color: #555; }
    dl.metadata dd { margin: 0; font-family: ui-monospace, monospace; overflow-wrap: anywhere; }
    pre.blob { white-space: pre-wrap; overflow-wrap: anywhere; background: #f4f5f8; padding: 1rem; border-radius: 6px; font-size: 0.9rem; }
    nav.event-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    /* the follow switch rides the far right of this row — space-between puts
       it there; it keeps its own margin only when it stands alone (index) */
    nav.event-nav .follow-toggle { margin-bottom: 0; }
    nav.event-nav > span { display: flex; gap: 1rem; }
    nav.event-nav .disabled { color: #aaa; }
    /* The stepping links are a wrapper only so they can be muted together —
       display:contents drops them back onto the nav's own 1rem gap, so all
       three items sit equidistant. */
    nav.event-nav .nav-steps { display: contents; }
    nav.event-nav .nav-steps a { color: #666; }
    p.notice { background: #f4f5f8; padding: 1rem; border-radius: 6px; }
    p.notice.warn { background: #fdf0ef; border: 1px solid #e0b4b4; }
    p.meta { color: #555; font-size: 0.85rem; }
    details.problems { background: #fdf0ef; border: 1px solid #e0b4b4; border-radius: 6px; padding: 0.6rem 1rem; margin-bottom: 1rem; font-size: 0.9rem; }
    details.problems summary { cursor: pointer; font-weight: 600; }
    /* prompt-timing waterfall. Series colors validated (dataviz six checks,
       light surface): llm #2a78d6, tool #eb6834, other #4a3aa7. */
    .stats { display: flex; gap: 2.5rem; margin: 1rem 0; flex-wrap: wrap; }
    .stats .v { font-size: 1.3rem; font-weight: 600; display: block; }
    .stats .l { font-size: 0.8rem; color: #555; }
    .legend { display: flex; gap: 1.25rem; align-items: center; font-size: 0.85rem; color: #555; margin: 0.75rem 0; }
    .chip { display: inline-block; width: 0.8rem; height: 0.8rem; border-radius: 3px; vertical-align: -0.1rem; margin-right: 0.35rem; }
    .cat-llm { background: #2a78d6; }
    .cat-tool { background: #eb6834; }
    .cat-other { background: #4a3aa7; }
    .bar-track .tick { position: absolute; top: -2px; height: 18px; width: 2px; background: #555; }
    /* chipless mark rows: indent past the 0.8rem chip + 0.35rem gap so
       mark names align with span names */
    .mark-name { margin-left: 1.15rem; }
    /* per-turn subagent tag (#1, #2, …) pairing a subagent.start with its
       stop by eye — quiet but always visible, unlike the uuid; nudged
       clear of the mark name, with a trailing middot before the inline
       goal/status that detail mode drops (its line break separates) */
    .subagent-ord { color: #555; font-size: 0.85rem; margin-left: 0.35rem; }
    body.show-detail .inline-only, tr.detail-open .inline-only { display: none; }
    /* after the tag's middot, a plain single space to the goal/status —
       the same gap as between a stop's status and its goal — instead of
       the usual inline span-detail indent */
    body:not(.show-detail) tr:not(.detail-open) .subagent-ord ~ .span-detail { margin-left: 0; }
    .copy-btn { background: none; border: 0; padding: 0; margin-left: 0.35rem; cursor: pointer; color: #bbb; vertical-align: -0.08em; }
    .copy-btn:hover { color: #555; }
    .copy-btn .ic-check { display: none; }
    .copy-btn.copied .ic-copy { display: none; }
    .copy-btn.copied .ic-check { display: inline; color: #2e9e44; }
    /* fixed layout so columns don't shift when the details switch hides
       or reveals content — widths come from the header row */
    table.waterfall { table-layout: fixed; }
    table.waterfall th, table.waterfall td { padding-left: 0.35rem; padding-right: 0.35rem; }
    /* keep the original breathing room at the offset|span boundary */
    table.waterfall th:first-child, table.waterfall td:first-child { padding-right: 0.6rem; }
    table.waterfall th:nth-child(2), table.waterfall td:nth-child(2) { padding-left: 0.6rem; }
    table.waterfall th.col-num { width: 4.5rem; }
    table.waterfall th.col-offset { width: 4rem; }
    table.waterfall th.col-bar { width: 45%; }
    table.waterfall td:nth-child(2) { overflow-wrap: break-word; }
    table.waterfall td.bar-cell { width: 45%; min-width: 14rem; }
    .bar-track { position: relative; height: 14px; background: #f4f5f8; border-radius: 4px; }
    .bar { position: absolute; top: 0; height: 14px; border-radius: 4px; min-width: 2px; }
    .bar.open { opacity: 0.55; }
    .badge-inflight { color: #8a5a00; font-size: 0.8rem; white-space: nowrap; }
    /* a turn a later one superseded: over, but its duration was never seen */
    .badge-noend { color: #999; font-size: 0.8rem; white-space: nowrap; }
    .inflight-strip { display: flex; gap: 1rem 1.5rem; flex-wrap: wrap; align-items: baseline; background: #fff8e6; border: 1px solid #e6d49a; border-radius: 6px; padding: 0.5rem 0.8rem; font-size: 0.85rem; margin-bottom: 1rem; }
    .inflight-strip .strip-label { color: #8a5a00; font-weight: 600; }
    .inflight-entry.current { font-weight: 600; }
    .inflight-entry[data-stale] { color: #777; }
    .follow-toggle { display: flex; justify-content: flex-end; align-items: center; gap: 0.4rem; font-size: 0.85rem; color: #555; margin-bottom: 0.5rem; cursor: pointer; }
    td.prompt-cell { max-width: 22rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .span-uuid { color: #bbb; font-size: 0.75rem; font-family: ui-monospace, monospace; white-space: nowrap; }
    .span-detail { display: flex; gap: 0.5rem; align-items: baseline; max-width: 36rem; font-size: 0.8rem; color: #555; margin: 0.15rem 0 0 1.15rem; }
    .span-detail code { font-family: ui-monospace, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .span-detail .path { flex: none; max-width: 16rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .span-detail .skill-action { flex: none; margin-right: 0.4rem; }
    .span-detail .skill-cat { flex: none; white-space: nowrap; font-family: ui-monospace, monospace; }
    /* skill_manage patch sides. The −/+ glyph carries the meaning; the tint
       only reinforces it, so a reader who cannot separate the two hues loses
       nothing. Kept desaturated — these sit next to prose, not in a diff view. */
    .span-detail .diff-mark { flex: none; font-family: ui-monospace, monospace; }
    .span-detail .diff-mark.del { color: #b04a3f; }
    .span-detail .diff-mark.ins { color: #2f7d55; }
    .span-detail .empty-new { color: #8a8a8a; font-style: italic; }
    /* .wide is for values that sit on their own line and can take more
       room than the 16rem default before ellipsizing */
    .span-detail .wide, .span-detail .tail { max-width: 32rem; }
    /* .tail ellipsizes from the left — the end of a long path matters more
       than the start; the template's &lrm; guards keep the bidi-neutral
       leading ~ or / from jumping across the rtl run */
    .span-detail .tail { direction: rtl; text-align: left; }
    /* details switch: the state is a body class set per page load (never
       persisted) so the live-region swap can't reset it. With details off
       the uuid hides and each span's extra info collapses from its own
       line into an inline continuation of the name line; the name cell is
       forced to a single ellipsized line so a row can never grow taller */
    /* Clicking a waterfall row toggles tr.detail-open (script below),
       opting just that row into the detailed layout while the switch is
       off — so every collapsed-mode rule exempts .detail-open rows; the
       arrow cursor is forced (no pointer, no text I-beam) so rows don't
       shout clickability — text selection still works */
    table.waterfall tbody tr[data-span-uuid] { cursor: default; }
    body:not(.show-detail) tr:not(.detail-open) .span-uuid { display: none; }
    body:not(.show-detail) table.waterfall tr:not(.detail-open) td:nth-child(2) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    body:not(.show-detail) tr:not(.detail-open) .span-detail { display: inline; margin: 0 0 0 0.35rem; }
    /* plain inline (not inline-block): an inline-block that no longer fits
       the cell is dropped whole as an atomic inline, whereas inline text is
       clipped mid-text by the cell-edge ellipsis — showing as many
       characters as fit */
    body:not(.show-detail) tr:not(.detail-open) .span-detail code,
    body:not(.show-detail) tr:not(.detail-open) .span-detail .path { display: inline; max-width: none; }
    /* …except .tail, which stays an inline-block so the rtl left-ellipsis
       still keeps the end of the path visible inline. Its max-width leaves
       ~12rem for the short file-tool name ahead of it; if earlier inline
       detail overruns that reserve the block is dropped whole at the cell
       edge — acceptable, that case only loses an already-clipped path */
    body:not(.show-detail) tr:not(.detail-open) .span-detail .tail { display: inline-block; max-width: calc(100% - 12rem); overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }
    /* a task's context nests fainter under its goal line (delegate_task
       detail view); a gap above each goal after the first keeps the
       task+context pairs visually separate */
    .span-detail.ctx { margin-left: 2.3rem; color: #8a8a8a; }
    .span-detail.list-item + .span-detail.task-goal { margin-top: 0.95rem; }
    /* .wrap-detail text (search queries, subagent goals, delegate
       briefs) drops the one-line ellipsis in the detailed layout and
       wraps out in full */
    body.show-detail .span-detail .wrap-detail,
    tr.detail-open .span-detail .wrap-detail { white-space: normal; overflow-wrap: anywhere; }
    /* …but code keeps its line breaks: a shell heredoc or a python snippet
       reflowed into a paragraph is unreadable. pre-wrap, and overflow
       visible so the wrapped lines are not clipped by the one-line rule */
    body.show-detail .span-detail code.wrap-detail,
    tr.detail-open .span-detail code.wrap-detail { white-space: pre-wrap; overflow: visible; }
    /* list-carrying scopes (todo, web_extract) render two variants: a
       first-item-plus-count line for inline mode and the full item list
       for detail mode */
    body.show-detail .list-compact, tr.detail-open .list-compact { display: none; }
    body:not(.show-detail) tr:not(.detail-open) .list-item { display: none; }
    .legend .detail-toggle { margin-left: auto; }
    .detail-toggle { display: inline-flex; align-items: center; gap: 0.4rem; cursor: pointer; }
    .detail-toggle input { position: absolute; opacity: 0; pointer-events: none; }
    .detail-toggle .track { width: 30px; height: 16px; border-radius: 8px; background: #ccc; position: relative; transition: background 0.15s; }
    .detail-toggle .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: left 0.15s; }
    .detail-toggle input:checked + .track { background: #2a78d6; }
    .detail-toggle input:checked + .track::after { left: 16px; }
    details.prompt, p.prompt { background: #f4f5f8; border-radius: 6px; padding: 0.6rem 1rem; margin: 0.75rem 0; font-size: 0.9rem; }
    details.prompt summary { cursor: pointer; }
    details.prompt pre.blob { margin: 0.6rem 0 0; padding: 0; background: none; }
  </style>
</head>
<body>
  <h1><a href="{{ url_for('root') }}">hermes observer</a></h1>
  <nav class="tabs">
    {% for tab in tabs %}
    <a href="{{ url_for(tab.endpoint) }}"{% if request.blueprint == tab.name %} class="active"{% endif %}>{{ tab.label }}</a>
    {% endfor %}
    {# Opens in its own tab: the tally is for checking while a page sits
       there polling, so navigating away from that page would defeat it. #}
    <a class="status-link" href="{{ url_for('request_status') }}"
       target="_blank" rel="noopener"
       title="Health of this web app itself — HTTP requests reaching the observer. Not agent activity.">observer status</a>
  </nav>
  {% block content %}{% endblock %}
  <script>
    // Live regions: an element with data-live-poll="<ms>" is refetched from
    // the current URL on that interval and swapped in place; a value of "0"
    // (e.g. a finished turn) means static — render but never poll. Polling
    // pauses while the tab is hidden.
    //
    // Follow mode ([data-follow-toggle], persisted in localStorage) auto-opens
    // a turn's page when an in-flight turn appears whose start_us is newer
    // than anything this page-view has already seen — but never while this
    // page is itself showing an in-flight turn ([data-inflight-current]
    // present), and never to a stale entry ([data-stale]). Follow keeps an
    // otherwise-static page polling slowly so the next turn start is noticed.
    // Waterfall rows the user clicked open (by span uuid), so their
    // per-row detail survives live-region swaps
    const openRows = new Set();

    (function () {
      const FOLLOW_KEY = "hermes-observer.follow";
      let region = document.querySelector("[data-live-poll]");
      const followOn = () => localStorage.getItem(FOLLOW_KEY) === "1";
      // Looked up on each use, never captured: on a turn page the toggle
      // sits in the nav *inside* the live region, so the swap replaces the
      // element. A held reference would go stale and silently stop working.
      const toggle = () => document.querySelector("[data-follow-toggle]");
      const syncToggle = () => {
        const el = toggle();
        if (el) el.checked = followOn();
      };
      // Delegated for the same reason — a listener bound to the element
      // would not survive the swap.
      document.addEventListener("change", (e) => {
        if (e.target.matches("[data-follow-toggle]")) {
          localStorage.setItem(FOLLOW_KEY, e.target.checked ? "1" : "0");
        }
      });
      syncToggle();
      if (!region) return;

      const entries = () => Array.from(region.querySelectorAll("[data-inflight-start-us]"));
      const startOf = (el) => parseInt(el.dataset.inflightStartUs, 10);
      let seenStartMax = Math.max(
        parseInt(region.dataset.turnStartUs || "0", 10), 0, ...entries().map(startOf));

      function followNewTurn() {
        const fresh = entries()
          .filter((el) => startOf(el) > seenStartMax)
          .sort((a, b) => startOf(b) - startOf(a));
        // Turns first seen now count as seen even when no navigation happens
        // (follow off, or mid-watch): only genuinely new starts pull forward.
        seenStartMax = Math.max(seenStartMax, ...entries().map(startOf));
        if (!toggle() || !followOn()) return;
        if (region.querySelector("[data-inflight-current]")) return;
        const target = fresh.find((el) => !el.dataset.stale);
        if (target) window.location.assign(target.getAttribute("href"));
      }

      const pollMs = () =>
        parseInt(region.dataset.livePoll, 10) || (toggle() && followOn() ? 3000 : 0);

      let busy = false;
      async function poll() {
        busy = true;
        try {
          const resp = await fetch(window.location.href);
          if (!resp.ok) return;
          const doc = new DOMParser().parseFromString(await resp.text(), "text/html");
          const fresh = doc.querySelector("[data-live-poll]");
          if (!fresh) return;
          // A swapped-in <details> arrives closed; reopen the ones the user
          // had open (matched by class — prompt, problems — else position).
          const open = new Set();
          region.querySelectorAll("details").forEach((d, i) => {
            if (d.open) open.add(d.className || String(i));
          });
          fresh.querySelectorAll("details").forEach((d, i) => {
            if (open.has(d.className || String(i))) d.open = true;
          });
          region.replaceWith(fresh);
          region = fresh;
          // the swapped-in follow and details switches arrive unchecked —
          // resync both to the state they are actually held in
          syncToggle();
          // (details state lives on <body>)
          region.querySelectorAll("[data-detail-toggle]").forEach((el) => {
            el.checked = document.body.classList.contains("show-detail");
          });
          region.querySelectorAll("tr[data-span-uuid]").forEach((tr) => {
            tr.classList.toggle("detail-open", openRows.has(tr.dataset.spanUuid));
          });
          followNewTurn();
        } catch (err) {
          // transient fetch failure — try again next tick
        } finally {
          busy = false;
        }
      }
      (function loop() {
        setTimeout(async () => {
          if (pollMs() && !busy && !document.hidden) await poll();
          loop();
        }, pollMs() || 1000);
      })();
    })();

    // Details switch (delegated so it survives live-region swaps): shows
    // the inline scope detail. Off on every initial load by design.
    document.addEventListener("change", (e) => {
      if (e.target.matches("[data-detail-toggle]")) {
        document.body.classList.toggle("show-detail", e.target.checked);
      }
    });

    // Clicking a waterfall row toggles that one row's detail, independent
    // of the global switch (delegated so it survives live-region swaps).
    // Links and buttons keep their own meaning, and a click that ends a
    // text selection is a copy gesture, not a toggle.
    document.addEventListener("click", (e) => {
      if (e.target.closest("a, button, label")) return;
      const row = e.target.closest("tr[data-span-uuid]");
      if (!row) return;
      if (String(window.getSelection())) return;
      const open = row.classList.toggle("detail-open");
      if (open) openRows.add(row.dataset.spanUuid);
      else openRows.delete(row.dataset.spanUuid);
    });

    // Copy buttons (delegated so they survive live-region swaps). The
    // async clipboard API needs a secure context, which plain-http access
    // from another host is not — fall back to execCommand there.
    document.addEventListener("click", (e) => {
      const btn = e.target.closest(".copy-btn");
      if (!btn) return;
      const text = btn.dataset.copy;
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text);
      } else {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); } finally { ta.remove(); }
      }
      btn.classList.add("copied");
      setTimeout(() => btn.classList.remove("copied"), 1200);
    });
  </script>
</body>
</html>

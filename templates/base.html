<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}hermes observer{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 70rem; padding: 0 1rem; color: #1a1a2e; }
    a { color: #2456c4; text-decoration: none; }
    a:hover { text-decoration: underline; }
    h1 { font-size: 1.4rem; }
    h1 a { color: inherit; }
    h2 { font-size: 1.1rem; margin-top: 2rem; }
    nav.tabs { display: flex; gap: 1.5rem; border-bottom: 1px solid #ddd; margin-bottom: 1.5rem; }
    nav.tabs a { padding: 0.4rem 0.2rem; color: #555; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    nav.tabs a:hover { text-decoration: none; border-bottom-color: #99b3e8; }
    nav.tabs a.active { color: #1a1a2e; font-weight: 600; border-bottom-color: #2456c4; }
    table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
    th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #ddd; vertical-align: top; }
    th { border-bottom: 2px solid #999; }
    td.num { text-align: right; white-space: nowrap; }
    dl.metadata { display: grid; grid-template-columns: max-content 1fr; gap: 0.25rem 1rem; font-size: 0.9rem; background: #f4f5f8; padding: 1rem; border-radius: 6px; }
    dl.metadata dt { font-weight: 600; color: #555; }
    dl.metadata dd { margin: 0; font-family: ui-monospace, monospace; overflow-wrap: anywhere; }
    pre.blob { white-space: pre-wrap; overflow-wrap: anywhere; background: #f4f5f8; padding: 1rem; border-radius: 6px; font-size: 0.9rem; }
    nav.event-nav { display: flex; justify-content: space-between; margin-bottom: 1rem; }
    nav.event-nav > span { display: flex; gap: 1rem; }
    nav.event-nav .disabled { color: #aaa; }
    p.notice { background: #f4f5f8; padding: 1rem; border-radius: 6px; }
    p.notice.warn { background: #fdf0ef; border: 1px solid #e0b4b4; }
    p.meta { color: #555; font-size: 0.85rem; }
    details.problems { background: #fdf0ef; border: 1px solid #e0b4b4; border-radius: 6px; padding: 0.6rem 1rem; margin-bottom: 1rem; font-size: 0.9rem; }
    details.problems summary { cursor: pointer; font-weight: 600; }
    /* prompt-timing waterfall. Series colors validated (dataviz six checks,
       light surface): llm #2a78d6, tool #eb6834, other #4a3aa7. */
    .stats { display: flex; gap: 2.5rem; margin: 1rem 0; flex-wrap: wrap; }
    .stats .v { font-size: 1.3rem; font-weight: 600; display: block; }
    .stats .l { font-size: 0.8rem; color: #555; }
    .legend { display: flex; gap: 1.25rem; align-items: center; font-size: 0.85rem; color: #555; margin: 0.75rem 0; }
    .chip { display: inline-block; width: 0.8rem; height: 0.8rem; border-radius: 3px; vertical-align: -0.1rem; margin-right: 0.35rem; }
    .cat-llm { background: #2a78d6; }
    .cat-tool { background: #eb6834; }
    .cat-other { background: #4a3aa7; }
    table.waterfall td.bar-cell { width: 45%; min-width: 14rem; }
    .bar-track { position: relative; height: 14px; background: #f4f5f8; border-radius: 4px; }
    .bar { position: absolute; top: 0; height: 14px; border-radius: 4px; min-width: 2px; }
    .bar.open { opacity: 0.55; }
    .badge-inflight { color: #8a5a00; font-size: 0.8rem; white-space: nowrap; }
  </style>
</head>
<body>
  <h1><a href="{{ url_for('root') }}">hermes observer</a></h1>
  <nav class="tabs">
    {% for tab in tabs %}
    <a href="{{ url_for(tab.endpoint) }}"{% if request.blueprint == tab.name %} class="active"{% endif %}>{{ tab.label }}</a>
    {% endfor %}
  </nav>
  {% block content %}{% endblock %}
</body>
</html>

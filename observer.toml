# Which tabs this observer serves, in tab order. The first one serves /.
#
# Each entry names an importable module: `plugins.prompts` from this tree and
# `hermes_observer_zep` from site-packages load the same way, so a tab written
# elsewhere needs no fork. See docs/extending/writing-a-plugin.md for the contract.
#
# `enabled = false` turns a tab off without removing its settings.
# `settings` is passed to the plugin untouched; ~ and $VARS are expanded.

[[tabs]]
module = "plugins.prompts"
# settings = { atof_log = "$HERMES_HOME/nemo-relay/atof/hermes-atof.jsonl" }
#
# `index_db` moves this tab's index of that log, which defaults to a file in
# your cache dir. It is a cache and not a source — delete it whenever you like
# and the next request rebuilds it. See docs/design/adr/0011.
# settings = { index_db = "/var/tmp/hermes-atof-index.sqlite3" }
#
# `scope_specs` names modules declaring how your own hermes tools should show
# on a turn page — one entry per scope, no fork of this tree. A name already
# in this app's table is overridden, and the banner says so at startup. See
# docs/extending/writing-a-scope-spec.md, and span-rendering.md for the
# vocabulary itself.
# settings = { scope_specs = ["hermes_observer_acme.specs"] }

[[tabs]]
module = "plugins.mem0"
# settings = { db = "$HERMES_HOME/jmem0_logged.db" }
